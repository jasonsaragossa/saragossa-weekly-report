name: Board figures — scheduled sends

# Checks every 15 minutes for board-report schedules that are due.
# Schedules are created from the Analytics page (Territory Summary → Schedule).
# GitHub can delay cron runs under load, so a send may land a few minutes late.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # run the due-check on demand

jobs:
  send-due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Send any due board schedules
        working-directory: api
        env:
          DATAVERSE_URL:           ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID:     ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID:     ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          ALERT_SENDER:            ${{ secrets.ALERT_SENDER }}
          BOARD_REPORT_RECIPIENTS: ${{ secrets.BOARD_REPORT_RECIPIENTS }}
          ROI_TRACKER_URL:         ${{ secrets.ROI_TRACKER_URL }}
          ROI_TRACKER_API_KEY:     ${{ secrets.ROI_TRACKER_API_KEY }}
        run: python board_schedule_run.py
