<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saragossa Weekly Report</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Set on <html> in the head so the dark palette never paints first. */
    try { if (localStorage.getItem("saragossa-theme") === "light")
      document.documentElement.classList.add("theme-light"); } catch (e) {}
  </script>
</head>
<body>

<header class="header">
  <a href="/" class="logo-link"><img src="/logo.svg" alt="Saragossa" class="logo"></a>
  <div class="header-right">
    <span class="data-note" id="data-note">Loading…</span>
    <span class="week-label">Week ending</span>
    <span id="report-date" class="report-date"></span>
    <nav class="main-menu" id="main-menu" data-active="report"></nav>
    <button class="theme-toggle" id="theme-toggle" type="button">◑ Light</button>
    <a href="/.auth/logout" class="logout-link">Sign out</a>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="panels" id="panels">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>Loading report data…</p>
  </div>
</div>

<div class="footer" id="footer"></div>

<script src="/theme.js"></script>
<script src="/nav.js"></script>
<script src="/app.js"></script>
</body>
</html>
