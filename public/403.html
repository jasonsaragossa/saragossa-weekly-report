<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Denied — Saragossa</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Set on <html> in the head so the dark palette never paints first. */
    try { if (localStorage.getItem("saragossa-theme") === "light")
      document.documentElement.classList.add("theme-light"); } catch (e) {}
  </script>
</head>
<body>
<header class="header">
  <a href="/"><img src="/logo.svg" alt="Saragossa" class="logo"></a>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle" type="button">◑ Light</button>
  </div>
</header>
<main class="denied">
  <h1 class="mbr-title">Access denied <em>not for this account</em></h1>
  <p class="settings-desc">You need Director or Bristol Finance &amp; Compliance access to view this page.</p>
  <a href="/" class="home-pill">← Back to home</a>
</main>
<script src="/theme.js"></script>
</body>
</html>
