<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBR — Saragossa</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="header">
  <img src="/logo.svg" alt="Saragossa" class="logo">
  <div class="header-right">
    <nav class="main-menu">
      <a href="/" class="menu-link">Weekly Report</a>
      <span class="menu-link disabled" title="Coming soon">121s</span>
      <a href="/mbr" class="menu-link active">MBRs <span class="beta-tag">beta</span></a>
      <span class="header-actions" id="admin-link" style="display:none">
        <a href="/admin" class="menu-link">Analytics</a>
        <a href="/settings" class="menu-link">⚙ Settings</a>
      </span>
    </nav>
    <a href="/.auth/logout" class="logout-link">Sign out</a>
  </div>
</header>

<div class="mbr-page">
  <div class="mbr-toolbar">
    <h1 class="mbr-title">Monthly Business Review</h1>
    <label class="mbr-ctl">Consultant <select id="mbr-person"></select></label>
    <label class="mbr-ctl">Month <input type="month" id="mbr-month"></label>
    <span class="mbr-status" id="mbr-status"></span>
  </div>

  <div id="mbr-content">
    <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
  </div>
</div>

<div class="footer" id="footer">Saragossa · MBR beta</div>

<script src="/mbr.js"></script>
</body>
</html>
