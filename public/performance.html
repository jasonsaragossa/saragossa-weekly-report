<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Stats — Saragossa</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Set on <html> in the head so the dark palette never paints first. */
    try { if (localStorage.getItem("saragossa-theme") === "light")
      document.documentElement.classList.add("theme-light"); } catch (e) {}
  </script>
</head>
<body>

<header class="header">
  <a href="/" class="logo-link"><img src="/logo.svg" alt="Saragossa" class="logo"></a>
  <div class="header-right">
    <nav class="main-menu" id="main-menu" data-active="perf"></nav>
    <button class="theme-toggle" id="theme-toggle" type="button">◑ Light</button>
    <a href="/.auth/logout" class="logout-link">Sign out</a>
  </div>
</header>

<div class="perf-page">
  <div class="perf-head">
    <h1 class="mbr-title">Performance Stats</h1>
    <span class="perf-sub" id="perf-sub"></span>
  </div>
  <div id="perf-content">
    <div class="loading-state"><div class="spinner"></div><p>Building the numbers…</p></div>
  </div>
</div>

<div class="footer">Saragossa · Performance Stats pilot</div>

<script src="/theme.js"></script>
<script src="/nav.js"></script>
<script src="/performance.js"></script>
</body>
</html>
