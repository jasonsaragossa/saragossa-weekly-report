<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly 1:1 — Saragossa</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="header">
  <img src="/logo.svg" alt="Saragossa" class="logo">
  <div class="header-right">
    <nav class="main-menu">
      <a href="/" class="menu-link">Weekly Report</a>
      <a href="/121" class="menu-link active">121s <span class="beta-tag">pilot</span></a>
      <a href="/mbr" class="menu-link">MBRs <span class="beta-tag">beta</span></a>
      <a href="/performance" class="menu-link">Performance Stats <span class="beta-tag">pilot</span></a>
      <span class="header-actions" id="admin-link" style="display:none">
        <a href="/admin" class="menu-link">Analytics</a>
        <a href="/settings" class="menu-link">⚙ Settings</a>
      </span>
    </nav>
    <a href="/.auth/logout" class="logout-link">Sign out</a>
  </div>
</header>

<div class="mbr-page">
  <div class="mbr-toolbar">
    <h1 class="mbr-title">Weekly 1:1</h1>
    <label class="mbr-ctl">Consultant <select id="oto-person"></select></label>
    <label class="mbr-ctl">Week beginning <input type="date" id="oto-week"></label>
    <button class="feedback-btn" id="feedback-open">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <span>Feedback to Jason</span>
    </button>
  </div>
  <div id="oto-content">
    <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
  </div>
</div>

<div class="footer">Saragossa · 1:1 pilot</div>

<script src="/121.js"></script>
</body>
</html>
