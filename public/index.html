<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saragossa Weekly Report</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Set on <html> in the head so the dark palette never paints first. */
    try { if (localStorage.getItem("saragossa-theme") === "light")
      document.documentElement.classList.add("theme-light"); } catch (e) {}
  </script>
</head>
<body>

<header class="header">
  <a href="/" class="logo-link"><img src="/logo.svg" alt="Saragossa" class="logo"></a>
  <div class="header-right">
    <nav class="main-menu" id="main-menu" data-active="home"></nav>
    <button class="theme-toggle" id="theme-toggle" type="button">◑ Light</button>
    <a href="/.auth/logout" class="logout-link">Sign out</a>
  </div>
</header>

<main class="home">
  <h1 class="home-title">Where to?</h1>
  <div class="home-grid" id="home-grid">
    <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
  </div>
</main>

<script src="/nav.js"></script>
<script src="/home.js"></script>
<script src="/theme.js"></script>
</body>
</html>
